<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Bank</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
    <h2><i class="fa-solid fa-building-columns"></i> ABC Digital Bank</h2>

    <div class="profile">
        <i class="fa-solid fa-circle-user"></i>
        <span>John Doe</span>
    </div>
</header>

<div class="container">

    <div class="left">

        <div class="balance">
            <h3>Available Balance</h3>
            <h1 id="balance">₹50,000</h1>
            <p>Savings Account</p>
        </div>

        <div class="cards">

            <div class="card blue">
    <h3>Balance</h3>
    <p id="totalBalance">₹50,000</p>
</div>

<div class="card green">
    <h3>Deposit</h3>
    <p id="totalDeposit">₹0</p>
</div>

<div class="card red">
    <h3>Withdraw</h3>
    <p id="totalWithdraw">₹0</p>
</div>

            <div class="card orange">
                <h3>Status</h3>
                <p>Active</p>
            </div>

        </div>

        <div class="transaction">
            <h3>Quick Transaction</h3>

            <input type="number" id="amount" placeholder="Enter Amount">

            <button class="deposit" onclick="deposit()">Deposit</button>
            <button class="withdraw" onclick="withdraw()">Withdraw</button>
            <button class="check" onclick="checkBalance()">Check Balance</button>
            <button class="reset" onclick="resetAccount()">Reset</button>
        </div>

    </div>

    <div class="right">

        <div class="details">
            <h3>Customer Details</h3>

            <p><b>Name :</b> John Doe</p>
            <p><b>Account :</b> XXXX4567</p>
            <p><b>Type :</b> Savings</p>
            <p><b>IFSC :</b> ABCD0001234</p>
        </div>

        <div class="history">
            <h3>Recent Transactions</h3>

            <ul id="historyList">
                <li>🏦 Welcome to ABC Digital Bank</li>
            </ul>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
